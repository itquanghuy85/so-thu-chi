services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: moneyflow
      POSTGRES_PASSWORD: moneyflow
      POSTGRES_DB: moneyflow
    ports:
      - '5432:5432'
    volumes:
      - moneyflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moneyflow -d moneyflow']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - postgres

volumes:
  moneyflow_pgdata:
