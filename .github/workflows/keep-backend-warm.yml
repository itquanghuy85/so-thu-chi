name: Keep backend warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -s -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" --max-time 60 https://so-thu-chi.onrender.com/v1
