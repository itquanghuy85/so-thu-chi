org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Works around a Kotlin incremental-compiler crash ("this and base files have
# different roots") that happens when the Gradle project (D:\...) and the
# Flutter pub cache (C:\Users\...\Pub\Cache) sit on different Windows drive
# letters — hit by sign_in_with_apple's Android plugin. Full (non-incremental)
# Kotlin compilation is slightly slower but avoids the crash entirely.
kotlin.incremental=false
